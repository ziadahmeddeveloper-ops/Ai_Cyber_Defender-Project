<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AI Cyber Defender</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-shield-halved" style="color: var(--accent);"></i>
                AI CYBER DEFENDER
            </div>
            
            <a href="index.html" class="menu-item"><i class="fa-solid fa-house"></i> Home</a>
            <a href="dashboard.html" class="menu-item active"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            <a href="scan.html" class="menu-item"><i class="fa-solid fa-expand"></i> AI Scanner</a>
            <a href="reports.html" class="menu-item"><i class="fa-solid fa-chart-bar"></i> Security Reports</a>
            <a href="profile.html" class="menu-item"><i class="fa-regular fa-user"></i> User Profile</a>
            
            <div style="margin-top: auto; padding: 2rem;">
                <button class="btn btn-outline" style="width: 100%;" onclick="logout()">LOGOUT</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;">
                <div>
                    <h1 style="font-size: 2.2rem; font-weight: 800;">DASHBOARD OVERVIEW</h1>
                    <p style="color: var(--text-secondary);" id="dashboardUserEmail">Logged in as: Admin</p>
                </div>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <button id="realtimeToggle" class="btn btn-outline" style="padding: 0.6rem 1.2rem; font-size: 0.75rem; border-color: var(--accent); color: var(--accent);">
                        <i class="fa-solid fa-bolt"></i> REAL-TIME: ON
                    </button>
                    <div style="background: rgba(0, 230, 118, 0.1); color: #00E676; padding: 0.6rem 1.2rem; border-radius: 50px; font-weight: 700; font-size: 0.8rem; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(0, 230, 118, 0.2);">
                        <span style="width: 8px; height: 8px; background: #00E676; border-radius: 50%; box-shadow: 0 0 10px #00E676;"></span>
                        SYSTEM ONLINE
                    </div>
                </div>
            </header>

            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Analysis</div>
                    <div class="stat-value" id="dashTotalScans">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Threats Blocked</div>
                    <div class="stat-value" id="dashMalicious" style="color: var(--danger);">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Secure Logs</div>
                    <div class="stat-value" id="dashSafe" style="color: var(--success);">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Active Agents</div>
                    <div class="stat-value" id="dashUsers">0</div>
                </div>
            </div>

            <!-- Chart Section -->
            <div class="glass-card">
                <h3 style="margin-bottom: 2rem; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px;">Threat Activity Trend</h3>
                <div style="height: 350px;">
                    <canvas id="scanTrendChart"></canvas>
                </div>
            </div>

            <!-- Alerts Section -->
            <div class="glass-card">
                <h3 style="margin-bottom: 2rem; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px;">Latest Security Alerts</h3>
                <div id="latestThreatsContainer">
                    <div style="color: var(--text-secondary); text-align: center; padding: 3rem 0;">
                        Initializing real-time stream...
                    </div>
                </div>
            </div>

            <!-- Details Modal -->
            <div id="detailsModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(10px);">
                <div class="glass-card" style="width: 90%; max-width: 800px; max-height: 90vh; overflow-y: auto; position: relative; padding: 3rem;">
                    <button onclick="closeModal()" style="position: absolute; top: 1.5rem; right: 1.5rem; background: transparent; border: none; color: white; font-size: 1.5rem; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
                    <div id="modalContent"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
