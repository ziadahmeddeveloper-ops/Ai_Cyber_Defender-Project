<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - AI Cyber Defender</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-shield-halved" style="color: var(--accent);"></i>
                AI CYBER DEFENDER
            </div>
            
            <a href="index.html" class="menu-item"><i class="fa-solid fa-house"></i> Home</a>
            <a href="dashboard.html" class="menu-item"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            <a href="scan.html" class="menu-item"><i class="fa-solid fa-expand"></i> AI Scanner</a>
            <a href="reports.html" class="menu-item active"><i class="fa-solid fa-chart-bar"></i> Security Reports</a>
            <a href="profile.html" class="menu-item"><i class="fa-regular fa-user"></i> User Profile</a>
            
            <div style="margin-top: auto; padding: 2rem;">
                <button class="btn btn-outline" style="width: 100%;" onclick="logout()">LOGOUT</button>
            </div>
        </aside>

        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;">
                <div>
                    <h1 style="font-size: 2.2rem; font-weight: 800;">SECURITY REPORTS</h1>
                    <p style="color: var(--text-secondary);">Historical analysis and threat trends summary.</p>
                </div>
                <div style="display: flex; gap: 0.8rem;">
                    <button class="btn btn-outline" style="padding: 0.6rem 1.2rem; font-size: 0.8rem;" onclick="loadReports('daily')">DAILY</button>
                    <button class="btn btn-outline" style="padding: 0.6rem 1.2rem; font-size: 0.8rem;" onclick="loadReports('weekly')">WEEKLY</button>
                    <button class="btn btn-outline" style="padding: 0.6rem 1.2rem; font-size: 0.8rem;" onclick="loadReports('monthly')">MONTHLY</button>
                </div>
            </header>

            <div class="glass-card">
                <h3 style="margin-bottom: 2.5rem; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px;">Threat History</h3>
                <div style="overflow-x: auto;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>PERIOD</th>
                                <th>TOTAL SCANS</th>
                                <th>THREATS</th>
                                <th>SAFE</th>
                            </tr>
                        </thead>
                        <tbody id="trendTableBody">
                            <tr><td colspan="4" style="text-align: center;">Loading analysis reports...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
